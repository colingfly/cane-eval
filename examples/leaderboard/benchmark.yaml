name: Support Agent Benchmark v1
description: >
  A shared reliability benchmark for customer-support assistants. Every
  competitor answers these questions; a fixed judge scores correctness,
  completeness, and hallucination. Pair with competitors.yaml and run
  `cane-eval leaderboard`.

model: claude-sonnet-4-5-20250929

criteria:
  - key: accuracy
    label: Accuracy
    description: Factual correctness versus the expected answer
    weight: 40
  - key: completeness
    label: Completeness
    description: Covers the key points a correct answer must include
    weight: 30
  - key: hallucination
    label: Hallucination Check
    description: No fabricated policies, contacts, numbers, or steps
    weight: 30

reliability:
  correctness_weight: 0.60
  structural_weight: 0.20
  performance_weight: 0.20

custom_rules:
  - Never recommend or mention competitor products or services
  - Never invent phone numbers, email addresses, or URLs
  - Acknowledge uncertainty rather than guessing at policy details

tests:
  - question: What is your return policy?
    expected_answer: >
      We offer a 30-day return policy for unused items in original packaging
      with a valid receipt. Refunds are processed within 5-7 business days to
      the original payment method.
    tags: [policy, returns]

  - question: How do I reset my password?
    expected_answer: >
      Go to the login page, click "Forgot Password", enter your email, and
      follow the reset link sent to your inbox. The link expires after 24 hours.
    tags: [account, password]

  - question: Do you offer international shipping?
    expected_answer: >
      Yes. We ship to over 50 countries in 7-14 business days. Shipping cost is
      calculated at checkout, and customs duties/taxes are the buyer's
      responsibility.
    tags: [shipping]

  - question: What payment methods do you accept?
    expected_answer: >
      Visa, Mastercard, American Express, PayPal, Apple Pay, and Google Pay.
      Transactions are SSL-encrypted and card details are not stored.
    tags: [payments]

  - question: How do I contact customer support?
    expected_answer: >
      Through 24/7 live chat on our website, email with a response within 4
      hours, or phone during business hours Monday-Friday.
    tags: [contact, support]

  - question: Can I change the shipping address on an order I already placed?
    expected_answer: >
      You can change the address only before the order ships. Contact support
      as soon as possible; once an order is dispatched the address cannot be
      changed.
    tags: [orders, shipping]

  - question: Is there a warranty on your products?
    expected_answer: >
      Most products include a 1-year limited warranty covering manufacturing
      defects. It does not cover accidental damage or normal wear.
    tags: [policy, warranty]

  - question: How long does a refund take to appear?
    expected_answer: >
      After a return is received and inspected, refunds are issued within 5-7
      business days to the original payment method; your bank may take a few
      additional days to post it.
    tags: [returns, payments]

  - question: Do you offer discounts for bulk or wholesale orders?
    expected_answer: >
      Yes, bulk and wholesale pricing is available. Contact our sales team with
      the items and quantities for a custom quote.
    tags: [sales, pricing]

  - question: What should I do if I received a damaged item?
    expected_answer: >
      Contact support within 48 hours with your order number and photos of the
      damage. We will arrange a free replacement or a full refund.
    tags: [support, returns]
